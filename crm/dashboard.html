<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Seguimiento - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<div class="app-layout" id="appLayout"></div>

<script src="assets/js/core.js"></script>
<script src="assets/js/sidebar.js"></script>
<script>
(function() {
  const user = Auth.guard();
  if (!user) return;

  // Render layout
  const layout = document.getElementById('appLayout');
  layout.innerHTML = `
    ${SidebarHTML.render('dashboard.html')}

    <div class="main-content" id="mainContent">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Dashboard</div>
          <div class="topbar-subtitle">Resumen general del sistema</div>
        </div>
        <div class="topbar-actions">
          <button class="btn-topbar" id="refreshBtn" title="Actualizar datos">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
            </svg>
          </button>
          <div style="width:1px;height:24px;background:var(--border);margin:0 4px;"></div>
          <div style="display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:var(--radius-md);background:var(--bg);">
            <div style="width:28px;height:28px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:white;" id="topUserAvatar"></div>
            <div style="font-size:13px;font-weight:600;" id="topUserName"></div>
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">

        <!-- GREETING -->
        <div class="dashboard-header">
          <div>
            <div class="dashboard-greeting" id="greeting">Hola,</div>
            <div class="dashboard-date" id="currentDate"></div>
          </div>
          <div style="display:flex;gap:var(--spacing-sm);">
            <button class="btn btn-secondary" onclick="window.location.href='orders.html'">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
              </svg>
              Ver Ordenes
            </button>
            ${Auth.isAdmin() ? `<button class="btn btn-primary" onclick="window.location.href='products.html'">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Nuevo Producto
            </button>` : ''}
          </div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid" id="statsGrid">
          <!-- Skeleton -->
          ${[1,2,3,4].map(() => `
            <div class="stat-card">
              <div>
                <div class="skeleton" style="width:80px;height:11px;margin-bottom:8px;"></div>
                <div class="skeleton" style="width:100px;height:28px;margin-bottom:8px;"></div>
                <div class="skeleton" style="width:60px;height:11px;"></div>
              </div>
              <div class="skeleton" style="width:48px;height:48px;border-radius:10px;"></div>
            </div>
          `).join('')}
        </div>

        <!-- GRID PRINCIPAL -->
        <div class="grid-3" style="margin-bottom:var(--spacing-lg);">

          <!-- ORDENES RECIENTES -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">Ordenes Recientes</div>
              <a href="orders.html" style="font-size:13px;color:var(--accent);font-weight:600;">Ver todas</a>
            </div>
            <div class="table-wrapper">
              <table class="data-table" id="recentOrdersTable">
                <thead>
                  <tr>
                    <th>Numero</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="recentOrdersBody">
                  <tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text-muted);">
                    <div class="spinner spinner-dark" style="margin:auto;"></div>
                  </td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- PANEL DERECHO -->
          <div style="display:flex;flex-direction:column;gap:var(--spacing-lg);">

            <!-- ALERTAS -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Alertas</div>
                <span class="badge badge-warning" id="alertCount">...</span>
              </div>
              <div class="card-body" style="padding:var(--spacing-md);">
                <div class="alerts-list" id="alertsList">
                  <div class="skeleton" style="height:40px;margin-bottom:8px;"></div>
                  <div class="skeleton" style="height:40px;"></div>
                </div>
              </div>
            </div>

            <!-- ACCESO RAPIDO -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Acceso Rapido</div>
              </div>
              <div class="card-body" style="padding:var(--spacing-md);">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;" id="quickLinks">
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- ACTIVIDAD RECIENTE -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Actividad Reciente</div>
            <a href="audit.html" style="font-size:13px;color:var(--accent);font-weight:600;">Ver todo</a>
          </div>
          <div class="card-body" style="padding:0 var(--spacing-xl);">
            <div id="activityList">
              ${[1,2,3].map(()=>`
                <div class="activity-item">
                  <div class="skeleton" style="width:36px;height:36px;border-radius:10px;flex-shrink:0;"></div>
                  <div style="flex:1;">
                    <div class="skeleton" style="height:13px;width:70%;margin-bottom:6px;"></div>
                    <div class="skeleton" style="height:11px;width:40%;"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

      </main>
    </div>
  `;

  // Init sidebar
  Sidebar.init();

  // Greeting & date
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Buenos dias' : hour < 18 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('greeting').textContent = `${greet}, ${user.nombre.split(' ')[0]}`;
  document.getElementById('currentDate').textContent = new Date().toLocaleDateString('es-EC', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // Topbar avatar
  document.getElementById('topUserAvatar').textContent = Fmt.initials(user.nombre);
  document.getElementById('topUserName').textContent   = user.nombre.split(' ')[0];

  // Refresh
  document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

  // Quick links
  const links = [
    { label: 'Ordenes',    href: 'orders.html',    color: '#3B82F6', icon: 'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z' },
    { label: 'Productos',  href: 'products.html',  color: '#10B981', icon: 'M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z' },
    { label: 'Empleados',  href: 'employees.html', color: '#F59E0B', icon: 'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2' },
    { label: 'Reportes',   href: 'reports.html',   color: '#8B5CF6', icon: 'M18 20V10M12 20V4M6 20v-6' },
  ];

  document.getElementById('quickLinks').innerHTML = links.map(l => `
    <a href="${l.href}" style="
      display:flex;flex-direction:column;align-items:center;gap:6px;
      padding:12px 8px;border-radius:10px;border:1px solid var(--border);
      background:var(--bg);text-decoration:none;
      transition:all 0.2s;cursor:pointer;
    " onmouseover="this.style.borderColor='${l.color}';this.style.background='${l.color}18'"
       onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--bg)'">
      <div style="width:32px;height:32px;border-radius:8px;background:${l.color}20;display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="14" fill="none" stroke="${l.color}" stroke-width="2" viewBox="0 0 24 24">
          <path d="${l.icon}"/>
        </svg>
      </div>
      <span style="font-size:11px;font-weight:600;color:var(--text-secondary)">${l.label}</span>
    </a>
  `).join('');

  loadDashboard();

  async function loadDashboard() {
    try {
      const data = await API.get('reports.php', { action: 'dashboard' });

      if (data.success) {
        renderStats(data);
        renderAlerts(data.alerts);
      }
    } catch (e) {
      Toast.error('Error al cargar el dashboard');
    }

    loadRecentOrders();
    loadRecentActivity();
  }

  function renderStats(data) {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card" style="--stat-color:var(--accent)">
        <div>
          <div class="stat-label">Ingresos del Dia</div>
          <div class="stat-value">${Fmt.money(data.today.revenue)}</div>
          <div class="stat-delta up">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
            Hoy
          </div>
        </div>
        <div class="stat-icon" style="background:var(--accent-soft);color:var(--accent);">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
          </svg>
        </div>
      </div>

      <div class="stat-card" style="--stat-color:var(--info)">
        <div>
          <div class="stat-label">Ordenes del Dia</div>
          <div class="stat-value">${data.today.orders}</div>
          <div class="stat-delta" style="color:var(--text-muted);">Hoy</div>
        </div>
        <div class="stat-icon" style="background:var(--info-soft);color:var(--info);">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          </svg>
        </div>
      </div>

      <div class="stat-card" style="--stat-color:var(--success)">
        <div>
          <div class="stat-label">Ingresos del Mes</div>
          <div class="stat-value">${Fmt.money(data.month.revenue)}</div>
          <div class="stat-delta" style="color:var(--text-muted);">${data.month.orders} ordenes</div>
        </div>
        <div class="stat-icon" style="background:var(--success-soft);color:var(--success);">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          </svg>
        </div>
      </div>

      <div class="stat-card" style="--stat-color:var(--warning)">
        <div>
          <div class="stat-label">Empleados Presentes</div>
          <div class="stat-value">${data.today.employees_present}</div>
          <div class="stat-delta" style="color:var(--text-muted);">Hoy</div>
        </div>
        <div class="stat-icon" style="background:var(--warning-soft);color:var(--warning);">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
          </svg>
        </div>
      </div>
    `;
  }

  function renderAlerts(alerts) {
    const count = (alerts.low_stock || 0) + (alerts.pending_orders || 0);
    document.getElementById('alertCount').textContent = count;

    const items = [];
    if (alerts.low_stock > 0) {
      items.push(`
        <div class="alert-item" style="border-color:var(--warning);">
          <svg width="16" height="16" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          <span style="color:var(--text-primary);">${alerts.low_stock} productos con stock bajo</span>
        </div>
      `);
    }
    if (alerts.pending_orders > 0) {
      items.push(`
        <div class="alert-item" style="border-color:var(--info);">
          <svg width="16" height="16" fill="none" stroke="var(--info)" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span style="color:var(--text-primary);">${alerts.pending_orders} ordenes pendientes de pago</span>
        </div>
      `);
    }

    document.getElementById('alertsList').innerHTML = items.length
      ? items.join('')
      : `<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">Sin alertas activas</div>`;
  }

  async function loadRecentOrders() {
    try {
      const data = await API.get('orders.php');
      const orders = (data.data || []).slice(0, 8);

      document.getElementById('recentOrdersBody').innerHTML = orders.length
        ? orders.map(o => `
          <tr style="cursor:pointer;" onclick="window.location.href='orders.html'">
            <td style="font-family:var(--font-mono);font-size:12px;">${o.order_number}</td>
            <td>${o.first_name || o.customer_name || '-'} ${o.last_name || ''}</td>
            <td style="font-weight:700;">${Fmt.money(o.total)}</td>
            <td>${Fmt.statusBadge(o.status)}</td>
          </tr>
        `).join('')
        : `<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text-muted);">Sin ordenes registradas</td></tr>`;
    } catch(e) {
      document.getElementById('recentOrdersBody').innerHTML =
        `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--danger);">Error al cargar ordenes</td></tr>`;
    }
  }

  async function loadRecentActivity() {
    try {
      const data = await API.get('audit.php', { action: 'list', limit: 6 });
      const logs  = data.logs || [];

      const actionColors = {
        CREATE: 'var(--success)', UPDATE: 'var(--info)',
        DELETE: 'var(--danger)', LOGIN: 'var(--warning)', LOGOUT: 'var(--text-muted)'
      };
      const actionBg = {
        CREATE: 'var(--success-soft)', UPDATE: 'var(--info-soft)',
        DELETE: 'var(--danger-soft)', LOGIN: 'var(--warning-soft)', LOGOUT: 'var(--bg)'
      };

      document.getElementById('activityList').innerHTML = logs.length
        ? logs.map(l => `
          <div class="activity-item">
            <div class="activity-icon" style="background:${actionBg[l.action]||'var(--bg)'};color:${actionColors[l.action]||'var(--text-muted)'};">
              <span style="font-size:11px;font-weight:800;">${l.action.slice(0,2)}</span>
            </div>
            <div class="activity-content">
              <div class="activity-text">${l.description || `${l.action} - ${l.entity_type}`}</div>
              <div class="activity-meta">${l.user_name || 'Sistema'} &bull; ${Fmt.datetime(l.created_at)}</div>
            </div>
          </div>
        `).join('')
        : `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Sin actividad reciente</div>`;
    } catch(e) {}
  }

})();
</script>
</body>
</html>
