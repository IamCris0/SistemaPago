<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAWEWE/ELPALACIO - Sistema de Seguimiento</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="img/logos.jpeg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #8C004B 0%, #6B0038 50%, #2C3E50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .loader-container {
            text-align: center;
            color: white;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            margin: 0 auto 30px;
            backdrop-filter: blur(10px);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 2px solid rgba(231, 76, 60, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 500px;
        }
        
        .error-title {
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .error-message {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: white;
            color: #8C004B;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">🏪</div>
        <h1>MAWEWE/ELPALACIO</h1>
        <p>Sistema de Seguimiento v4.0</p>
        <div class="spinner"></div>
        <div class="status" id="status">Iniciando sistema...</div>
        <div id="errorContainer"></div>
    </div>
    
    <script src="js/config.js"></script>
    <script>
        // Variables de estado
        let retryCount = 0;
        const MAX_RETRIES = 3;
        
        // Función para actualizar el estado
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        // Función para mostrar error
        function showError(title, message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error">
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
                    <button class="btn" onclick="location.reload()">Reintentar</button>
                </div>
            `;
            document.querySelector('.spinner').style.display = 'none';
        }
        
        // Función para verificar la API
        async function checkAPI() {
            try {
                updateStatus('Verificando conexión con la API...');
                
                const response = await fetch(`${CONFIG.API_URL}/products.php`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    updateStatus('✅ Conexión exitosa con la API');
                    return true;
                } else {
                    throw new Error('La API no respondió correctamente');
                }
                
            } catch (error) {
                console.error('Error verificando API:', error);
                
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    updateStatus(`Reintentando conexión (${retryCount}/${MAX_RETRIES})...`);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    return checkAPI();
                } else {
                    showError(
                        '❌ Error de Conexión',
                        `No se pudo conectar con la API en ${CONFIG.API_URL}. Por favor verifica tu conexión a internet e intenta nuevamente.`
                    );
                    return false;
                }
            }
        }
        
        // Función para verificar sesión
        function checkSession() {
            updateStatus('Verificando sesión...');
            
            const user = CONFIG.getUser();
            const token = CONFIG.getToken();
            
            if (user && token) {
                updateStatus('✅ Sesión activa encontrada');
                
                // Redirigir según el tipo de usuario
                if (user.is_admin) {
                    updateStatus('Redirigiendo al panel de administrador...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    updateStatus('Redirigiendo al panel de empleado...');
                    setTimeout(() => {
                        window.location.href = 'employee.html';
                    }, 1000);
                }
                
                return true;
            }
            
            return false;
        }
        
        // Función principal de inicialización
        async function init() {
            console.log('🚀 Iniciando Sistema MAWEWE/ELPALACIO v4.0');
            console.log('📍 API URL:', CONFIG.API_URL);
            
            try {
                // 1. Verificar API
                const apiOK = await checkAPI();
                
                if (!apiOK) {
                    return;
                }
                
                // 2. Pequeña pausa para mejor UX
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 3. Verificar sesión
                const hasSession = checkSession();
                
                // 4. Si no hay sesión, ir al login
                if (!hasSession) {
                    updateStatus('Redirigiendo al login...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                }
                
            } catch (error) {
                console.error('Error en inicialización:', error);
                showError(
                    '❌ Error de Inicialización',
                    'Ocurrió un error al iniciar el sistema. Por favor intenta nuevamente.'
                );
            }
        }
        
        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Log de información del sistema
        console.log('%c🏪 MAWEWE/ELPALACIO', 'font-size: 24px; font-weight: bold; color: #8C004B;');
        console.log('%cSistema de Seguimiento v4.0', 'font-size: 14px; color: #666;');
        console.log('%c© 2026 Joyería Mawewe - Todos los derechos reservados', 'font-size: 12px; color: #999;');
    </script>
</body>
</html>
