<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Seguimiento - Productos</title>
    <link rel="icon" type="image/png" href="assets/img/icono.png">
  <link rel="apple-touch-icon" href="assets/img/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .img-slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 4px;
    }
    .img-slot {
      border: 2px dashed var(--border-dark);
      border-radius: var(--radius-md);
      aspect-ratio: 1/1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg);
      transition: border-color .2s, background .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .img-slot:hover { border-color: var(--accent); background: var(--accent-soft); }
    .img-slot.has-img { border-style: solid; border-color: var(--accent); }
    .img-slot.uploading { pointer-events: none; opacity: .7; }
    .img-slot-badge {
      position: absolute; top: 5px; left: 5px;
      background: var(--accent); color: white;
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; letter-spacing: .5px; text-transform: uppercase; z-index: 2;
    }
    .img-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-slot-placeholder {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 11px;
      text-align: center; padding: 8px;
    }
    .img-slot-placeholder svg { opacity: .45; }
    .img-slot-clear {
      position: absolute; top: 5px; right: 5px;
      width: 22px; height: 22px;
      background: rgba(239,68,68,.85); color: white;
      border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      opacity: 0; transition: opacity .15s; z-index: 3; line-height: 1;
    }
    .img-slot.has-img:hover .img-slot-clear { opacity: 1; }
    .img-slot-spinner {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.75);
      display: flex; align-items: center; justify-content: center; z-index: 4;
    }
    .img-file-input { display: none; }
    .sku-row { display: flex; gap: 6px; align-items: flex-end; }
    .sku-row .form-control { flex: 1; }
    .btn-sku-gen {
      flex-shrink: 0; height: 40px; padding: 0 12px;
      background: var(--accent-soft); color: var(--accent);
      border: 1.5px solid var(--accent); border-radius: var(--radius-md);
      font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: all .15s; display: flex; align-items: center; gap: 4px;
    }
    .btn-sku-gen:hover { background: var(--accent); color: white; }
    .btn-sku-gen:disabled { opacity: .4; pointer-events: none; }
    .btn-sku-gen svg { width: 13px; height: 13px; }
    .cat-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout"></div>

<!-- MODAL: Crear / Editar Producto -->
<div class="modal-overlay" id="productModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="productModalTitle">Nuevo Producto</div>
      <button class="modal-close" data-modal-close>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="productForm" autocomplete="off">
        <input type="hidden" id="prodId" name="id">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">SKU</label>
            <div class="sku-row">
              <input type="text" id="prodSku" name="sku" class="form-control"
                     placeholder="Ej: ROP-AME-001" required>
              <button type="button" class="btn-sku-gen" id="btnGenSku" title="Generar SKU automático">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <polyline points="23 4 23 10 17 10"/>
                  <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                </svg>
                Auto SKU
              </button>
            </div>
            <div class="cat-hint" id="skuHint">Escribe la categoría y subcategoría primero para auto-generar</div>
          </div>
          <div class="form-group">
            <label class="form-label required" for="prodPrice">Precio (USD)</label>
            <input type="number" id="prodPrice" name="price" class="form-control"
                   placeholder="0.00" step="0.01" min="0" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label required" for="prodName">Nombre del Producto</label>
          <input type="text" id="prodName" name="name" class="form-control"
                 placeholder="Nombre completo del producto" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Categoría</label>
            <input type="text" id="prodCategory" name="category" class="form-control"
                   list="categoriesList" placeholder="ropa, peluches, juguetes..." autocomplete="off">
            <datalist id="categoriesList"></datalist>
            <div class="cat-hint">Selecciona una existente o escribe una nueva</div>
          </div>
          <div class="form-group">
            <label class="form-label">Subcategoría</label>
            <input type="text" id="prodSubcategory" name="subcategory" class="form-control"
                   list="subcategoriesList" placeholder="americanino, chevignon..." autocomplete="off">
            <datalist id="subcategoriesList"></datalist>
            <div class="cat-hint">Selecciona una existente o escribe una nueva</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prodStock">Stock</label>
            <input type="number" id="prodStock" name="stock" class="form-control" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label class="form-label" for="prodActive">Estado</label>
            <select id="prodActive" name="active" class="form-control">
              <option value="1">Activo</option>
              <option value="0">Inactivo</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">
            Imágenes del producto
            <span style="font-weight:400;color:var(--text-muted);">(máx. 3)</span>
          </label>
          <div class="img-slots-grid" id="imgSlotsGrid"></div>
          <div class="cat-hint" style="margin-top:6px;">
            Haz clic en cada slot para subir una imagen desde tu dispositivo. La primera es la imagen principal.
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="prodDescription">Descripción</label>
          <textarea id="prodDescription" name="description" class="form-control" rows="3"
                    placeholder="Descripción detallada del producto..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close>Cancelar</button>
      <button class="btn btn-primary" id="saveProductBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar Producto
      </button>
    </div>
  </div>
</div>

<!-- MODAL: Ver producto -->
<div class="modal-overlay" id="productViewModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">Detalle del Producto</div>
      <button class="modal-close" data-modal-close>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="productViewBody"></div>
  </div>
</div>

<script src="assets/js/core.js"></script>
<script src="assets/js/sidebar.js"></script>
<script>
(function() {
  const user = Auth.guard();
  if (!user) return;

  function imgSrc(path) {
    if (!path) return '';
    if (path.startsWith('http')) return path;
    if (path.startsWith('images/')) return 'https://mawewe.com.ec/' + path;
    return 'https://tienda.mawewe.com.ec/' + path;
  }

  /* ══════════════════════════════════════════════════════
     LAYOUT
  ══════════════════════════════════════════════════════ */
  document.getElementById('appLayout').innerHTML = `
    ${SidebarHTML.render('products.html')}
    <div class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Productos</div>
          <div class="topbar-subtitle">Catálogo e inventario</div>
        </div>
        <div class="topbar-actions">
          <div class="view-toggle">
            <button class="view-btn active" id="viewTable" title="Vista tabla">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
            </button>
            <button class="view-btn" id="viewGrid" title="Vista cuadrícula">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              </svg>
            </button>
          </div>
          <button class="btn btn-primary" id="newProductBtn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nuevo Producto
          </button>
        </div>
      </header>
      <main class="page-content">
        <div class="page-header">
          <div>
            <div class="page-title">Inventario de Productos</div>
            <div class="page-subtitle" id="prodSubtitle">Cargando...</div>
          </div>
        </div>
        <div class="filters-bar" style="flex-wrap:wrap;">
          <div class="search-box">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="form-control" id="prodSearch"
                   placeholder="Buscar nombre, SKU..." style="padding-left:38px;min-width:260px;">
          </div>
          <select class="form-control" id="prodCategoryFilter" style="width:auto;min-width:150px;">
            <option value="">Todas las categorías</option>
          </select>
          <select class="form-control" id="prodStockFilter" style="width:auto;min-width:150px;">
            <option value="">Todo el stock</option>
            <option value="out">Sin stock</option>
            <option value="low">Stock bajo (&lt;5)</option>
            <option value="ok">Stock normal</option>
          </select>
          <select class="form-control" id="prodActiveFilter" style="width:auto;min-width:130px;">
            <option value="1">Activos</option>
            <option value="0">Inactivos</option>
            <option value="">Todos</option>
          </select>
        </div>
        <div id="productTableView">
          <div class="card">
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Producto</th><th>SKU</th><th>Categoría</th>
                    <th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="productTableBody">
                  <tr><td colspan="7" style="text-align:center;padding:32px;">
                    <div class="spinner spinner-dark" style="margin:auto;"></div>
                  </td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div id="productGridView" class="products-grid hidden"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--spacing-lg);">
          <div style="font-size:13px;color:var(--text-muted);" id="prodPaginationInfo"></div>
          <div class="pagination" id="prodPagination"></div>
        </div>
      </main>
    </div>
  `;

  Sidebar.init();

  let products    = [];
  let filtered    = [];
  let currentPage = 1;
  const perPage   = 15;
  let viewMode    = 'table';
  let imgSlotData = [null, null, null];
  let catMap      = {};

  /* ══════════════════════════════════════════════════════
     CATEGORÍAS
  ══════════════════════════════════════════════════════ */
  async function loadCategories() {
    try {
      const data = await API.get('products_crud.php', { action: 'categories' });
      if (!data.success) return;
      catMap = data.categories || {};
      const catList = data.categoryList || Object.keys(catMap);
      document.getElementById('categoriesList').innerHTML =
        catList.map(c => `<option value="${c}">`).join('');
      const sel = document.getElementById('prodCategoryFilter');
      const cur = sel.value;
      sel.innerHTML = '<option value="">Todas las categorías</option>' +
        catList.map(c => `<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
      updateSubcategoryList();
    } catch(e) { console.error('Error cargando categorías:', e); }
  }

  function updateSubcategoryList() {
    const cat  = document.getElementById('prodCategory')?.value?.trim() || '';
    const subs = catMap[cat] || [];
    document.getElementById('subcategoriesList').innerHTML =
      subs.map(s => `<option value="${s}">`).join('');
  }

  /* ══════════════════════════════════════════════════════
     AUTO-SKU
  ══════════════════════════════════════════════════════ */
  async function generateSku() {
    const cat = document.getElementById('prodCategory').value.trim();
    const sub = document.getElementById('prodSubcategory').value.trim();
    if (!cat) { Toast.warning('Escribe primero la categoría'); document.getElementById('prodCategory').focus(); return; }
    const btn = document.getElementById('btnGenSku');
    btn.disabled = true;
    btn.innerHTML = `<svg class="spinner spinner-dark" style="width:13px;height:13px;border-width:2px;"></svg> Generando...`;
    try {
      const params = { action: 'next-sku', category: cat };
      if (sub) params.subcategory = sub;
      const data = await API.get('products_crud.php', params);
      if (data.success) {
        document.getElementById('prodSku').value = data.sku;
        document.getElementById('skuHint').textContent = `SKU generado: ${data.sku} (prefijo: ${data.prefix})`;
        Toast.success(`SKU generado: ${data.sku}`);
      } else { Toast.error(data.message || 'No se pudo generar el SKU'); }
    } catch(e) { Toast.error('Error al generar SKU'); }
    btn.disabled = false;
    btn.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="13" height="13">
      <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>Auto SKU`;
  }

  /* ══════════════════════════════════════════════════════
     SLOTS DE IMAGEN
  ══════════════════════════════════════════════════════ */
  function buildImgSlots() {
    const grid = document.getElementById('imgSlotsGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const slot = document.createElement('div');
      slot.className = 'img-slot' + (imgSlotData[i] ? ' has-img' : '');
      slot.id = `imgSlot_${i}`;
      if (i === 0) slot.innerHTML += `<div class="img-slot-badge">Principal</div>`;
      slot.innerHTML += `<input type="file" class="img-file-input" id="imgFile_${i}" accept="image/jpeg,image/png,image/webp,image/gif">`;
      if (imgSlotData[i]) {
        slot.innerHTML += `<img src="${imgSrc(imgSlotData[i])}" id="imgPreview_${i}" onerror="this.style.display='none'">
          <div class="img-slot-clear" title="Quitar imagen" id="imgClear_${i}">&times;</div>`;
      } else {
        slot.innerHTML += `<div class="img-slot-placeholder">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg><span>Haz clic para subir</span></div>`;
      }
      slot.innerHTML += `<div class="img-slot-spinner hidden" id="imgSpinner_${i}">
        <div class="spinner spinner-dark"></div></div>`;
      grid.appendChild(slot);
      slot.addEventListener('click', e => { if (e.target.closest('.img-slot-clear')) return; document.getElementById(`imgFile_${i}`).click(); });
      document.getElementById(`imgFile_${i}`).addEventListener('change', e => handleFileSelect(i, e.target));
    }
    for (let i = 0; i < 3; i++) {
      const cb = document.getElementById(`imgClear_${i}`);
      if (cb) cb.addEventListener('click', e => { e.stopPropagation(); clearSlot(i); });
    }
  }

  function clearSlot(i) { imgSlotData[i] = null; buildImgSlots(); }

  async function handleFileSelect(i, input) {
    const file = input.files[0];
    if (!file) return;
    const slot = document.getElementById(`imgSlot_${i}`);
    const spinner = document.getElementById(`imgSpinner_${i}`);
    slot.classList.add('uploading');
    spinner.classList.remove('hidden');
    const category = document.getElementById('prodCategory').value.trim() || 'general';
    const sku      = document.getElementById('prodSku').value.trim() || 'PROD';
    const fd = new FormData();
    fd.append('image', file); fd.append('category', category);
    fd.append('sku', sku); fd.append('token', Auth.getToken() || '');
    try {
      const res = await fetch(`${CONFIG.API_BASE}/products_crud.php?action=upload-image`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${Auth.getToken()}` },
        body: fd
      });
      let data;
      try { data = await res.json(); } catch(e) {
        Toast.error('Respuesta inesperada del servidor (no JSON)');
        slot.classList.remove('uploading'); spinner.classList.add('hidden'); input.value = ''; return;
      }
      if (data.success) { imgSlotData[i] = data.path; Toast.success(`Imagen ${i + 1} subida`); buildImgSlots(); }
      else { Toast.error(data.message || 'Error al subir la imagen'); slot.classList.remove('uploading'); spinner.classList.add('hidden'); }
    } catch(e) {
      Toast.error('Sin respuesta del servidor. Verifica la conexión.');
      slot.classList.remove('uploading'); spinner.classList.add('hidden');
    }
    input.value = '';
  }

  function resetSlots() { imgSlotData = [null, null, null]; buildImgSlots(); }

  function loadSlotsFromProduct(p) {
    imgSlotData = [null, null, null];
    const imgs = Array.isArray(p.images) ? [...p.images] : [];
    if (imgs.length === 0 && p.image) imgs.push(p.image);
    for (let i = 0; i < Math.min(imgs.length, 3); i++) imgSlotData[i] = imgs[i] || null;
    buildImgSlots();
  }

  function getSlotsResult() {
    const urls = imgSlotData.filter(Boolean);
    return { image: urls[0] || '', images: urls };
  }

  /* ══════════════════════════════════════════════════════
     CARGA
  ══════════════════════════════════════════════════════ */
  async function load() {
    try {
      const params = {};
      const active = document.getElementById('prodActiveFilter').value;
      if (active !== '') params.active = active;
      const data = await API.get('products_crud.php', { action: 'list', limit: 500, ...params });
      products = data.products || [];
      await loadCategories();
      applyFilters();
    } catch(e) { Toast.error('Error al cargar productos'); }
  }

  function applyFilters() {
    const q     = document.getElementById('prodSearch').value.toLowerCase();
    const cat   = document.getElementById('prodCategoryFilter').value;
    const stock = document.getElementById('prodStockFilter').value;
    filtered = products.filter(p => {
      const mQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) ||
                  (p.description||'').toLowerCase().includes(q);
      const mC = !cat || p.category === cat;
      const mS = !stock ? true :
                  stock==='out' ? p.stock===0 :
                  stock==='low' ? (p.stock>0 && p.stock<5) : p.stock>=5;
      return mQ && mC && mS;
    });
    document.getElementById('prodSubtitle').textContent = `${filtered.length} producto${filtered.length!==1?'s':''}`;
    currentPage = 1;
    renderProducts();
  }

  function renderProducts() {
    const start = (currentPage-1)*perPage;
    const page  = filtered.slice(start, start+perPage);
    const total = Math.ceil(filtered.length/perPage);
    document.getElementById('prodPaginationInfo').textContent =
      filtered.length ? `Mostrando ${start+1}–${Math.min(start+perPage, filtered.length)} de ${filtered.length}` : '';
    renderPagination('prodPagination', currentPage, total, p => { currentPage=p; renderProducts(); });
    if (viewMode==='table') renderTable(page); else renderGrid(page);
  }

  function imgTag(p) {
    if (p.image) return `<img src="${imgSrc(p.image)}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;" onerror="this.style.display='none'">`;
    return `<div style="width:40px;height:40px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-muted);">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/></svg></div>`;
  }

  /* ── TABLA ── */
  function renderTable(page) {
    const tbody = document.getElementById('productTableBody');
    if (!page.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
        <div class="empty-state-title">Sin productos</div>
        <div class="empty-state-desc">Prueba otros filtros o agrega un nuevo producto</div>
      </div></td></tr>`;
      return;
    }
    tbody.innerHTML = page.map(p => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            ${imgTag(p)}
            <div>
              <div style="font-weight:600;font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</div>
              <div style="font-size:11px;color:var(--text-muted);">${p.subcategory||''}</div>
            </div>
          </div>
        </td>
        <td><span style="font-family:var(--font-mono);font-size:12px;">${p.sku}</span></td>
        <td><span class="badge badge-neutral">${p.category}</span></td>
        <td style="font-weight:700;color:var(--accent);">${Fmt.money(p.price)}</td>
        <td>${Fmt.stockBadge(p.stock)}</td>
        <td><span class="badge ${p.active?'badge-success':'badge-danger'}">${p.active?'Activo':'Inactivo'}</span></td>
        <td>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="viewProduct(${p.id})" title="Ver">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="btn btn-secondary btn-sm btn-icon" onclick="editProduct(${p.id})" title="Editar">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="btn btn-secondary btn-sm btn-icon"
                    onclick="updateStock(${p.id},'${p.name.replace(/'/g,"\\'")}',${p.stock})" title="Stock">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
            </button>
            <button class="btn btn-danger btn-sm btn-icon"
                    onclick="deleteProduct(${p.id},'${p.name.replace(/'/g,"\\'")}',${p.active})"
                    title="${p.active?'Desactivar':'Activar'}">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  /* ── GRID ── */
  function renderGrid(page) {
    const c = document.getElementById('productGridView');
    if (!page.length) {
      c.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-title">Sin productos</div></div>`;
      return;
    }
    c.innerHTML = page.map(p => `
      <div class="product-card">
        <div class="product-card-img">
          ${p.image
            ? `<img src="${imgSrc(p.image)}" alt="${p.name}" loading="lazy">`
            : `<div style="color:var(--text-muted);">
                <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <rect x="2" y="2" width="20" height="20" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                </svg></div>`}
        </div>
        <div class="product-card-body">
          <div class="product-name">${p.name}</div>
          <div class="product-sku">${p.sku}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
            <div class="product-price">${Fmt.money(p.price)}</div>
            ${Fmt.stockBadge(p.stock)}
          </div>
        </div>
        <div class="product-card-actions">
          <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="viewProduct(${p.id})">Ver</button>
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="editProduct(${p.id})">Editar</button>
        </div>
      </div>`).join('');
  }

  /* ══════════════════════════════════════════════════════
     EVENTOS MODAL — categoría / subcategoría / sku
  ══════════════════════════════════════════════════════ */
  document.getElementById('prodCategory').addEventListener('input', () => {
    updateSubcategoryList();
    document.getElementById('prodSubcategory').value = '';
    updateSkuHint();
  });
  document.getElementById('prodSubcategory').addEventListener('input', updateSkuHint);

  function updateSkuHint() {
    const cat = document.getElementById('prodCategory').value.trim();
    const sub = document.getElementById('prodSubcategory').value.trim();
    const hint = document.getElementById('skuHint');
    if (cat) {
      const catCode = cat.replace(/[^a-zA-Z]/g,'').substring(0,3).toUpperCase();
      const subCode = sub ? sub.replace(/[^a-zA-Z]/g,'').substring(0,3).toUpperCase() : '';
      const preview = subCode ? `${catCode}-${subCode}-XXX` : `${catCode}-XXX`;
      hint.textContent = `Formato esperado: ${preview} — haz clic en "Auto SKU" para generar`;
    } else {
      hint.textContent = 'Escribe la categoría y subcategoría primero para auto-generar';
    }
  }

  document.getElementById('btnGenSku').addEventListener('click', generateSku);

  /* ══════════════════════════════════════════════════════
     VISTA TOGGLE
  ══════════════════════════════════════════════════════ */
  document.getElementById('viewTable').addEventListener('click', () => {
    viewMode = 'table';
    document.getElementById('viewTable').classList.add('active');
    document.getElementById('viewGrid').classList.remove('active');
    document.getElementById('productTableView').classList.remove('hidden');
    document.getElementById('productGridView').classList.add('hidden');
    renderProducts();
  });
  document.getElementById('viewGrid').addEventListener('click', () => {
    viewMode = 'grid';
    document.getElementById('viewGrid').classList.add('active');
    document.getElementById('viewTable').classList.remove('active');
    document.getElementById('productGridView').classList.remove('hidden');
    document.getElementById('productTableView').classList.add('hidden');
    renderProducts();
  });

  /* ══════════════════════════════════════════════════════
     NUEVO PRODUCTO — disponible para todos los empleados
  ══════════════════════════════════════════════════════ */
  document.getElementById('newProductBtn').addEventListener('click', () => {
    document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
    document.getElementById('productForm').reset();
    document.getElementById('prodId').value = '';
    document.getElementById('skuHint').textContent = 'Escribe la categoría y subcategoría primero para auto-generar';
    resetSlots();
    Modal.open('productModal');
  });

  /* ══════════════════════════════════════════════════════
     GUARDAR PRODUCTO
  ══════════════════════════════════════════════════════ */
  document.getElementById('saveProductBtn').addEventListener('click', async () => {
    const id       = document.getElementById('prodId').value;
    const name     = document.getElementById('prodName').value.trim();
    const sku      = document.getElementById('prodSku').value.trim();
    const category = document.getElementById('prodCategory').value.trim();
    const price    = document.getElementById('prodPrice').value;
    if (!name || !sku || !price || !category) {
      Toast.warning('Completa los campos requeridos: SKU, Nombre, Categoría y Precio');
      return;
    }
    const { image, images } = getSlotsResult();
    const body = {
      id:          id ? parseInt(id) : undefined,
      sku, name, category,
      subcategory: document.getElementById('prodSubcategory').value.trim(),
      price:       parseFloat(price),
      stock:       parseInt(document.getElementById('prodStock').value || 0),
      active:      parseInt(document.getElementById('prodActive').value),
      image, images,
      description: document.getElementById('prodDescription').value.trim()
    };
    try {
      const data = id
        ? await API.put('products_crud.php?action=update', body)
        : await API.post('products_crud.php?action=create', body);
      if (data.success) {
        Toast.success(id ? 'Producto actualizado' : 'Producto creado');
        Modal.closeAll();
        await load();
      } else { Toast.error(data.message || 'Error al guardar'); }
    } catch(e) { Toast.error('Error de conexión'); }
  });

  /* ══════════════════════════════════════════════════════
     EDITAR
  ══════════════════════════════════════════════════════ */
  window.editProduct = async function(id) {
    try {
      const data = await API.get(`products_crud.php?action=get&id=${id}`);
      if (!data.success) return;
      const p = data.product;
      document.getElementById('productModalTitle').textContent = 'Editar Producto';
      document.getElementById('prodId').value          = p.id;
      document.getElementById('prodSku').value         = p.sku;
      document.getElementById('prodName').value        = p.name;
      document.getElementById('prodCategory').value    = p.category;
      document.getElementById('prodSubcategory').value = p.subcategory || '';
      document.getElementById('prodPrice').value       = p.price;
      document.getElementById('prodStock').value       = p.stock;
      document.getElementById('prodActive').value      = p.active ? '1' : '0';
      document.getElementById('prodDescription').value = p.description || '';
      updateSubcategoryList();
      updateSkuHint();
      loadSlotsFromProduct(p);
      Modal.open('productModal');
    } catch(e) { Toast.error('Error al cargar producto'); }
  };

  /* ══════════════════════════════════════════════════════
     VER
  ══════════════════════════════════════════════════════ */
  window.viewProduct = async function(id) {
    try {
      const data = await API.get(`products_crud.php?action=get&id=${id}`);
      if (!data.success) return;
      const p = data.product;
      const allImgs = Array.isArray(p.images) ? p.images : (p.image ? [p.image] : []);
      document.getElementById('productViewBody').innerHTML = `
        <div style="display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;">
          <div>
            <div style="background:var(--bg);border-radius:12px;overflow:hidden;aspect-ratio:1;margin-bottom:8px;">
              ${p.image
                ? `<img src="${imgSrc(p.image)}" style="width:100%;height:100%;object-fit:cover;"
                        onerror="this.parentNode.innerHTML='<div style=height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted)>Sin imagen</div>'">`
                : `<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);">Sin imagen</div>`}
            </div>
            ${allImgs.length > 1 ? `
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${allImgs.map((img,idx) => `
                  <img src="${imgSrc(img)}"
                       style="width:54px;height:54px;border-radius:8px;object-fit:cover;
                              border:2px solid ${idx===0?'var(--accent)':'var(--border)'};"
                       onerror="this.style.display='none'">`).join('')}
              </div>` : ''}
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;margin-bottom:4px;">${p.category} / ${p.subcategory||'-'}</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">${p.name}</div>
            <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-bottom:16px;">${p.sku}</div>
            <div style="font-size:28px;font-weight:800;color:var(--accent);margin-bottom:16px;">${Fmt.money(p.price)}</div>
            <div style="display:flex;gap:8px;margin-bottom:20px;">
              ${Fmt.stockBadge(p.stock)}
              <span class="badge ${p.active?'badge-success':'badge-danger'}">${p.active?'Activo':'Inactivo'}</span>
            </div>
            ${p.description ? `<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">${p.description}</div>` : ''}
          </div>
        </div>`;
      Modal.open('productViewModal');
    } catch(e) { Toast.error('Error'); }
  };

  /* ══════════════════════════════════════════════════════
     STOCK RÁPIDO
  ══════════════════════════════════════════════════════ */
  window.updateStock = function(id, name, currentStock) {
    const ns = prompt(`Nuevo stock para "${name}":`, currentStock);
    if (ns === null) return;
    const n = parseInt(ns);
    if (isNaN(n) || n < 0) { Toast.warning('Valor de stock no válido'); return; }
    API.put('products_crud.php?action=update-stock', { id, stock: n }).then(data => {
      if (data.success) { Toast.success('Stock actualizado'); load(); }
      else Toast.error(data.message);
    });
  };

  /* ══════════════════════════════════════════════════════
     ELIMINAR / TOGGLE
  ══════════════════════════════════════════════════════ */
  window.deleteProduct = function(id, name, isActive) {
    if (isActive) {
      Modal.confirm('Desactivar producto', `"${name}" será desactivado y no aparecerá en la tienda.`,
        async () => {
          const data = await API.put('products_crud.php?action=toggle-status', { id });
          if (data.success) { Toast.success('Producto desactivado'); load(); }
        }
      );
    } else {
      Modal.confirm('Activar producto', `"${name}" volverá a estar disponible en la tienda.`,
        async () => {
          const data = await API.put('products_crud.php?action=toggle-status', { id });
          if (data.success) { Toast.success('Producto activado'); load(); }
        }, false
      );
    }
  };

  /* ══════════════════════════════════════════════════════
     FILTROS + INIT
  ══════════════════════════════════════════════════════ */
  document.getElementById('prodSearch').addEventListener('input', debounce(applyFilters, 250));
  document.getElementById('prodCategoryFilter').addEventListener('change', applyFilters);
  document.getElementById('prodStockFilter').addEventListener('change', applyFilters);
  document.getElementById('prodActiveFilter').addEventListener('change', load);

  buildImgSlots();
  load();
})();
</script>
</body>
</html>
