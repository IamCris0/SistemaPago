<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Seguimiento MAWEWE/ELPALACIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #8C004B 0%, #6B0038 50%, #2C3E50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #8C004B, #6B0038);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-logo {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            padding: 15px;
        }
        
        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #8C004B;
            box-shadow: 0 0 0 4px rgba(140, 0, 75, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8C004B, #6B0038);
            color: white;
            box-shadow: 0 4px 12px rgba(140, 0, 75, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(140, 0, 75, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .login-footer {
            padding: 20px 30px;
            background: #F5F5F5;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        
        .login-footer a {
            color: #8C004B;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert.show {
            display: block;
            animation: shake 0.5s;
        }
        
        .alert-error {
            background: #FEE2E2;
            color: #991B1B;
            border: 2px solid #FCA5A5;
        }
        
        .alert-success {
            background: #D1FAE5;
            color: #065F46;
            border: 2px solid #6EE7B7;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .login-container {
                border-radius: 0;
                max-width: none;
            }
            
            .login-header {
                padding: 30px 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header con Logo Real -->
        <div class="login-header">
            <div class="login-logo">
                <img src="img/logos.jpeg" alt="MAWEWE Logo" onerror="this.parentElement.innerHTML=''">
            </div>
            <h1>MAWEWE/ELPALACIO</h1>
            <p>Sistema de Seguimiento v4.0</p>
        </div>
        
        <!-- Body -->
        <div class="login-body">
            <div id="alert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="cedula" class="form-label">Cédula de Identidad</label>
                    <input 
                        type="text" 
                        id="cedula" 
                        class="form-control"
                        placeholder="Ingresa tu cédula (10 dígitos)"
                        maxlength="10"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>
                
                <button type="submit" class="btn btn-primary" id="btnLogin">
                    <span id="btnText">🔐 Iniciar Sesión</span>
                </button>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="login-footer">
            <p>© 2026 Palacio/Mawewe • Lago Agrio, Ecuador</p>
            <p style="margin-top: 8px;">
                ¿Problemas? <a href="mailto:soporte@mawewe.com.ec">Contactar Soporte</a>
            </p>
        </div>
    </div>
    
    <script>
        const CONFIG = {
            API_URL: 'https://mawewe.com.ec/api',
            VERSION: '4.0.0'
        };
        
        const form = document.getElementById('loginForm');
        const cedulaInput = document.getElementById('cedula');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alert');
        
        // Solo números en cédula
        cedulaInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        // Submit del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cedula = cedulaInput.value.trim();
            
            // Validaciones
            if (cedula.length !== 10) {
                showAlert('La cédula debe tener exactamente 10 dígitos', 'error');
                return;
            }
            
            // Deshabilitar botón
            btnLogin.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Verificando...';
            
            try {
                const response = await fetch(`${CONFIG.API_URL}/auth.php?action=login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cedula })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Guardar sesión
                    localStorage.setItem('mawewe_user_v3', JSON.stringify(data.employee));
                    localStorage.setItem('mawewe_token_v3', data.token);
                    localStorage.setItem('mawewe_permissions_v3', JSON.stringify(data.permissions));
                    
                    showAlert('✅ Login exitoso! Redirigiendo...', 'success');
                    
                    // Redirigir según el rol
                    setTimeout(() => {
                        if (data.employee.is_admin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 1000);
                    
                } else {
                    throw new Error(data.message || 'Credenciales inválidas');
                }
                
            } catch (error) {
                console.error('Error en login:', error);
                showAlert('❌ ' + error.message, 'error');
                
                // Rehabilitar botón
                btnLogin.disabled = false;
                btnText.textContent = '🔐 Iniciar Sesión';
                
            }
        });
        
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }
        
        // Verificar si ya hay sesión activa
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('mawewe_user_v3');
            const token = localStorage.getItem('mawewe_token_v3');
            
            if (user && token) {
                try {
                    const userData = JSON.parse(user);
                    
                    showAlert('Ya tienes una sesión activa. Redirigiendo...', 'success');
                    
                    setTimeout(() => {
                        if (userData.is_admin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 1500);
                    
                } catch (e) {
                    // Si hay error parseando, limpiar storage
                    localStorage.clear();
                }
            }
        });
        
        console.log('🔐 Sistema de Login v4.0 - MAWEWE/ELPALACIO');
    </script>
</body>
</html>
