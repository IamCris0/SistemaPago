<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mawewe CRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8C004B 0%, #4A0028 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background: linear-gradient(135deg, #8C004B 0%, #6B0038 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8C004B;
            box-shadow: 0 0 0 3px rgba(140, 0, 75, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8C004B 0%, #6B0038 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(140, 0, 75, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 480px) {
            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 26px;
            }

            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏪 Mawewe CRM</h1>
            <p>Sistema de Gestión Empresarial</p>
        </div>

        <div class="login-body">
            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="cedula">Cédula de Identidad</label>
                    <input 
                        type="text" 
                        id="cedula" 
                        name="cedula" 
                        placeholder="Ingresa tu cédula (10 dígitos)"
                        maxlength="10"
                        required
                        autocomplete="off"
                    >
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="btnText">Iniciar Sesión</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            © 2026 Mawewe - Todos los derechos reservados
        </div>
    </div>

    <script>
        const API_URL = 'https://mawewe.com.ec/api';

        const loginForm = document.getElementById('loginForm');
        const cedulaInput = document.getElementById('cedula');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alert');

        // Solo permitir números en cédula
        cedulaInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Manejar submit del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const cedula = cedulaInput.value.trim();

            // Validar cédula
            if (cedula.length !== 10) {
                showAlert('Por favor ingresa una cédula válida de 10 dígitos', 'error');
                return;
            }

            // Deshabilitar botón
            btnLogin.disabled = true;
            btnText.innerHTML = 'Verificando... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/employees.php?action=login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cedula })
                });

                const data = await response.json();

                if (data.success) {
                    // Guardar datos en localStorage
                    localStorage.setItem('mawewe_employee', JSON.stringify(data.employee));
                    localStorage.setItem('mawewe_token', data.token);

                    showAlert('¡Login exitoso! Redirigiendo...', 'success');

                    // Redirigir según tipo de usuario
                    setTimeout(() => {
                        if (data.employee.is_admin) {
                            window.location.href = 'admin/panel.html';
                        } else {
                            window.location.href = 'employee/panel.html';
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || 'Error al iniciar sesión', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión. Por favor intenta nuevamente.', 'error');
            } finally {
                btnLogin.disabled = false;
                btnText.textContent = 'Iniciar Sesión';
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type} show`;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // Verificar si ya hay sesión activa
        window.addEventListener('load', () => {
            const employee = localStorage.getItem('mawewe_employee');
            if (employee) {
                const emp = JSON.parse(employee);
                if (emp.is_admin) {
                    window.location.href = 'admin/panel.html';
                } else {
                    window.location.href = 'employee/panel.html';
                }
            }
        });
    </script>
</body>
</html>
