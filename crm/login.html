<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema MAWEWE/ELPALACIO</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="img/logos.jpeg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #003d82 0%, #002952 50%, #001a33 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Fondo animado con puntos */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: backgroundPulse 20s ease-in-out infinite;
        }
        
        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 10px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* Header con gradiente azul marino */
        .login-header {
            background: linear-gradient(135deg, #003d82 0%, #002952 100%);
            color: white;
            padding: 48px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            animation: rotate 15s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Logo con imagen real */
        .login-logo {
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .login-logo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
        }
        
        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }
        
        .login-header p {
            font-size: 15px;
            opacity: 0.9;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        
        /* Body del formulario */
        .login-body {
            padding: 48px 40px;
        }
        
        .form-group {
            margin-bottom: 28px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.2px;
        }
        
        .form-control {
            width: 100%;
            padding: 16px 18px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            background: #f8fafc;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #003d82;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 61, 130, 0.1);
            transform: translateY(-2px);
        }
        
        /* Botón con gradiente azul marino */
        .btn {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.2px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #003d82 0%, #002952 100%);
            color: white;
            box-shadow: 0 8px 16px rgba(0, 61, 130, 0.35);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 61, 130, 0.45);
        }
        
        .btn-primary:active:not(:disabled) {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* Alertas */
        .alert {
            padding: 16px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
            font-weight: 600;
            align-items: center;
            gap: 12px;
        }
        
        .alert.show {
            display: flex;
            animation: shake 0.5s, fadeIn 0.3s;
        }
        
        .alert-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.15));
            color: #991B1B;
            border: 2px solid rgba(239, 68, 68, 0.3);
        }
        
        .alert-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.15));
            color: #065F46;
            border: 2px solid rgba(16, 185, 129, 0.3);
        }
        
        .alert-icon {
            font-size: 20px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Spinner de carga */
        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Features con iconos mejorados */
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 28px 40px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-top: 1px solid #e2e8f0;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 61, 130, 0.1), rgba(0, 61, 130, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        
        .feature-text {
            flex: 1;
        }
        
        .feature-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        
        .feature-desc {
            font-size: 12px;
            color: #64748b;
        }
        
        /* Footer */
        .login-footer {
            padding: 24px 40px;
            background: #f8fafc;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
        
        .login-footer p {
            margin: 0;
            line-height: 1.6;
        }
        
        .login-footer a {
            color: #003d82;
            text-decoration: none;
            font-weight: 700;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            
            .login-container {
                border-radius: 0;
                max-width: none;
                min-height: 100vh;
            }
            
            .login-header {
                padding: 40px 28px;
            }
            
            .login-logo {
                width: 120px;
                height: 120px;
            }
            
            .login-body {
                padding: 36px 28px;
            }
            
            .features {
                grid-template-columns: 1fr;
                padding: 24px 28px;
            }
            
            .login-footer {
                padding: 20px 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header con Logo Real -->
        <div class="login-header">
            <div class="login-logo">
                <img src="img/logos.jpeg" alt="MAWEWE Logo" onerror="this.parentElement.innerHTML='<div style=\'font-size:60px;\'>🏪</div>'">
            </div>
            <h1>MAWEWE/ELPALACIO</h1>
            <p>Sistema de Seguimiento v4.0</p>
        </div>
        
        <!-- Formulario -->
        <div class="login-body">
            <div id="alert" class="alert">
                <span class="alert-icon"></span>
                <span class="alert-text"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="cedula" class="form-label">Cédula de Identidad</label>
                    <input 
                        type="text" 
                        id="cedula" 
                        class="form-control"
                        placeholder="Ingresa tu cédula (10 dígitos)"
                        maxlength="10"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>
                
                <button type="submit" class="btn btn-primary" id="btnLogin">
                    <span id="btnText">🔐 Iniciar Sesión</span>
                </button>
            </form>
        </div>
        
        <!-- Features -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">
                    <div class="feature-title">Seguro</div>
                    <div class="feature-desc">Acceso protegido</div>
                </div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">
                    <div class="feature-title">Rápido</div>
                    <div class="feature-desc">Login instantáneo</div>
                </div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">
                    <div class="feature-title">Completo</div>
                    <div class="feature-desc">Todo en un lugar</div>
                </div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-text">
                    <div class="feature-title">Multi-dispositivo</div>
                    <div class="feature-desc">Desde cualquier lugar</div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="login-footer">
            <p><strong>© 2026 Mawewe/El Palacio</strong></p>
            <p style="margin-top: 4px;">Lago Agrio, Ecuador</p>
            <p style="margin-top: 12px;">
                ¿Problemas de acceso? <a href="mailto:soporte@mawewe.com.ec">Contactar Soporte</a>
            </p>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const cedulaInput = document.getElementById('cedula');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const alertBox = document.getElementById('alert');
        
        // Solo números en cédula
        cedulaInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        // Submit del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cedula = cedulaInput.value.trim();
            
            // Validaciones
            if (cedula.length !== 10) {
                showAlert('La cédula debe tener exactamente 10 dígitos', 'error');
                return;
            }
            
            // Deshabilitar botón
            btnLogin.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Verificando...';
            
            try {
                const response = await fetch(`${CONFIG.API_URL}/auth.php?action=login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cedula })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Guardar sesión
                    localStorage.setItem('mawewe_user_v3', JSON.stringify(data.employee));
                    localStorage.setItem('mawewe_token_v3', data.token);
                    localStorage.setItem('mawewe_permissions_v3', JSON.stringify(data.permissions));
                    
                    showAlert('Login exitoso! Redirigiendo...', 'success');
                    
                    // Redirigir según el rol
                    setTimeout(() => {
                        if (data.employee.is_admin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 1000);
                    
                } else {
                    throw new Error(data.message || 'Credenciales inválidas');
                }
                
            } catch (error) {
                console.error('Error en login:', error);
                showAlert(error.message, 'error');
                
                // Rehabilitar botón
                btnLogin.disabled = false;
                btnText.innerHTML = '🔐 Iniciar Sesión';
            }
        });
        
        function showAlert(message, type) {
            const icon = type === 'success' ? '✓' : '✕';
            alertBox.querySelector('.alert-icon').textContent = icon;
            alertBox.querySelector('.alert-text').textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }
        
        // Verificar sesión activa
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('mawewe_user_v3');
            const token = localStorage.getItem('mawewe_token_v3');
            
            if (user && token) {
                try {
                    const userData = JSON.parse(user);
                    
                    showAlert('Sesión activa. Redirigiendo...', 'success');
                    
                    setTimeout(() => {
                        if (userData.is_admin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 1500);
                    
                } catch (e) {
                    localStorage.clear();
                }
            }
        });
        
        console.log('🔐 Sistema de Login MAWEWE/ELPALACIO v4.0');
        console.log('Tema: Azul Marino Profesional (#003d82)');
    </script>
</body>
</html>
