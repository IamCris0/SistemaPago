<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Sistema de Seguimiento</title>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/employees.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            color: #111827;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            font-size: 16px;
            color: #6b7280;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #374151;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .back-button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header de Página -->
        <a href="dashboard.html" class="back-button">
            ← Volver al Dashboard
        </a>
        
        <div class="page-header">
            <h1 class="page-title">Sistema de Seguimiento</h1>
            <p class="page-subtitle">Módulo de Gestión de Empleados</p>
        </div>
        
        <!-- Contenedor del Módulo -->
        <div id="employeesContainer">
            <!-- El módulo se renderizará aquí -->
            <div style="text-align: center; padding: 4rem; background: white; border-radius: 8px;">
                <div style="font-size: 48px; margin-bottom: 1rem;">⏳</div>
                <p style="color: #6b7280;">Cargando módulo de empleados...</p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/modules/employees.js"></script>
    
    <script>
        // Verificar autenticación
        function checkAuth() {
            const user = localStorage.getItem('mawewe_user_v3');
            const token = localStorage.getItem('mawewe_token_v3');
            
            if (!user || !token) {
                window.location.href = 'index.html';
                return false;
            }
            
            try {
                const userData = JSON.parse(user);
                
                // Solo administradores pueden gestionar empleados
                if (!userData.is_admin) {
                    alert('Acceso denegado. Solo administradores pueden gestionar empleados.');
                    window.location.href = 'dashboard.html';
                    return false;
                }
                
                return true;
            } catch (e) {
                console.error('Error verificando usuario:', e);
                localStorage.clear();
                window.location.href = 'index.html';
                return false;
            }
        }
        
        // Inicializar módulo cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Inicializando página de empleados');
            
            // Verificar autenticación
            if (!checkAuth()) return;
            
            // Inicializar módulo
            try {
                await EmployeeModule.init();
                console.log('Módulo de empleados inicializado correctamente');
            } catch (error) {
                console.error('Error inicializando módulo:', error);
                
                const container = document.getElementById('employeesContainer');
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem; background: white; border-radius: 8px; border: 1px solid #e5e7eb;">
                        <div style="font-size: 48px; margin-bottom: 1rem; color: #ef4444;">✕</div>
                        <h3 style="margin-bottom: 0.5rem;">Error al cargar el módulo</h3>
                        <p style="color: #6b7280; margin-bottom: 1.5rem;">${error.message}</p>
                        <button class="btn btn-primary" onclick="location.reload()">
                            Reintentar
                        </button>
                    </div>
                `;
            }
        });
        
        // Prevenir salida accidental con cambios sin guardar
        let hasUnsavedChanges = false;
        
        window.addEventListener('beforeunload', (e) => {
            if (hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
