<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Seguimiento - Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <style>
    .modal-lg { max-width: 680px; }
    .client-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .info-block { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; }
    .info-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
    .info-val   { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .info-sub   { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .det-grid2  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    @media(max-width:580px){ .det-grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout"></div>

<!-- ── MODAL CREAR / EDITAR ── -->
<div class="modal-overlay" id="modalForm">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="formTitle">Nuevo Cliente</div>
      <button class="modal-close" onclick="Modal.closeAll()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label required">Nombre</label>
          <input type="text" id="fFn" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="form-group">
          <label class="form-label required">Apellido</label>
          <input type="text" id="fLn" class="form-control" placeholder="Apellido" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label required">Email</label>
          <input type="email" id="fEmail" class="form-control" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="text" id="fPhone" class="form-control" placeholder="09XXXXXXXX">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cédula / RUC</label>
          <input type="text" id="fCed" class="form-control" placeholder="0XXXXXXXXX">
        </div>
        <div class="form-group">
          <label class="form-label">Ciudad</label>
          <input type="text" id="fCity" class="form-control" placeholder="Ciudad">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Dirección</label>
        <input type="text" id="fAddr" class="form-control" placeholder="Calle, número, sector...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Código postal</label>
          <input type="text" id="fPostal" class="form-control" placeholder="000000">
        </div>
        <div class="form-group">
          <label class="form-label">Notas</label>
          <input type="text" id="fNotes" class="form-control" placeholder="Observaciones opcionales...">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.closeAll()">Cancelar</button>
      <button class="btn btn-primary" id="btnSave">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- ── MODAL DETALLE ── -->
<div class="modal-overlay" id="modalDetail">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="detTitle">Perfil del Cliente</div>
      <button class="modal-close" onclick="Modal.closeAll()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detBody" style="max-height:68vh;overflow-y:auto;"></div>
    <div class="modal-footer" id="detFooter"></div>
  </div>
</div>

<script src="assets/js/core.js"></script>
<script src="assets/js/sidebar.js"></script>
<script>
(function() {
  const user = Auth.guard();
  if (!user) return;

  /* ═══════════ LAYOUT ═══════════ */
  document.getElementById('appLayout').innerHTML = `
    ${SidebarHTML.render('customers.html')}
    <div class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Clientes</div>
          <div class="topbar-subtitle">Base de datos de clientes</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" id="btnRefresh">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
          <button class="btn btn-primary" id="btnNew">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo Cliente
          </button>
        </div>
      </header>
      <main class="page-content">

        <!-- STATS -->
        <div class="stats-grid" id="statsGrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:var(--spacing-xl);">
          ${[0,1,2].map(()=>`<div class="stat-card"><div class="skeleton" style="width:100%;height:64px;border-radius:8px;"></div></div>`).join('')}
        </div>

        <!-- FILTROS -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          <div>
            <div class="page-title">Todos los Clientes</div>
            <div class="page-subtitle" id="subCount">Cargando...</div>
          </div>
        </div>
        <div class="filters-bar" style="margin-bottom:var(--spacing-lg);">
          <div style="position:relative;flex:1;min-width:220px;">
            <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);" width="14" height="14" fill="none" stroke="var(--text-muted)" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="fSearch" class="form-control" placeholder="Buscar por nombre, email, teléfono..." style="padding-left:36px;">
          </div>
          <button class="btn btn-secondary btn-sm" id="btnClear">Limpiar</button>
        </div>

        <!-- TABLA -->
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Contacto</th>
                  <th>Ciudad</th>
                  <th>Cédula / RUC</th>
                  <th>Registrado por</th>
                  <th>Fecha</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="cBody">
                <tr><td colspan="7" style="text-align:center;padding:40px;">
                  <div class="spinner spinner-dark" style="margin:auto;"></div>
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--spacing-lg);">
          <div style="font-size:13px;color:var(--text-muted);" id="pgInfo"></div>
          <div class="pagination" id="pgBar"></div>
        </div>

      </main>
    </div>`;

  Sidebar.init();

  /* ═══════════ ESTADO ═══════════ */
  let customers = [], filtered = [], page = 1;
  const PER = 25;

  /* ═══════════ CARGAR ═══════════ */
  async function load() {
    document.getElementById('cBody').innerHTML =
      `<tr><td colspan="7" style="text-align:center;padding:40px;"><div class="spinner spinner-dark" style="margin:auto;"></div></td></tr>`;
    try {
      const data = await API.get('customers.php?action=list');
      customers = data.customers || [];
      applyFilter();
      renderStats();
    } catch(e) {
      document.getElementById('cBody').innerHTML = `
        <tr><td colspan="7">
          <div class="empty-state">
            <div class="empty-state-title">Error al cargar clientes</div>
            <div class="empty-state-desc"><small style="font-family:monospace;color:var(--danger);">${e.message}</small></div>
            <button class="btn btn-primary" onclick="load()" style="margin-top:14px;">Reintentar</button>
          </div>
        </td></tr>`;
    }
  }

  /* ═══════════ FILTRAR ═══════════ */
  function applyFilter() {
    const q = document.getElementById('fSearch').value.trim().toLowerCase();
    filtered = q
      ? customers.filter(c =>
          `${c.first_name} ${c.last_name}`.toLowerCase().includes(q) ||
          (c.email||'').toLowerCase().includes(q) ||
          (c.phone||'').includes(q) ||
          (c.cedula||'').includes(q)
        )
      : [...customers];
    document.getElementById('subCount').textContent =
      `${filtered.length} cliente${filtered.length !== 1 ? 's' : ''}`;
    page = 1;
    renderTable();
  }

  /* ═══════════ STATS ═══════════ */
  function renderStats() {
    const total = customers.length;
    const today = new Date().toISOString().slice(0,10);
    const hoy   = customers.filter(c => (c.created_at||'').slice(0,10) === today).length;
    const conCed = customers.filter(c => c.cedula && c.cedula.trim()).length;

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card" style="--stat-color:var(--accent)">
        <div><div class="stat-label">Total Clientes</div><div class="stat-value">${total}</div>
          <div style="font-size:11px;color:var(--text-muted);">En base de datos</div></div>
        <div class="stat-icon" style="background:var(--accent-soft);color:var(--accent);">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></div></div>
      <div class="stat-card" style="--stat-color:var(--success)">
        <div><div class="stat-label">Registrados Hoy</div><div class="stat-value">${hoy}</div>
          <div style="font-size:11px;color:var(--text-muted);">Nuevos hoy</div></div>
        <div class="stat-icon" style="background:var(--success-soft);color:var(--success);">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
      <div class="stat-card" style="--stat-color:var(--info)">
        <div><div class="stat-label">Con Cédula</div><div class="stat-value">${conCed}</div>
          <div style="font-size:11px;color:var(--text-muted);">Datos completos</div></div>
        <div class="stat-icon" style="background:var(--info-soft);color:var(--info);">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg></div></div>`;
  }

  /* ═══════════ TABLA ═══════════ */
  function renderTable() {
    const start = (page - 1) * PER;
    const slice = filtered.slice(start, start + PER);
    const pages = Math.ceil(filtered.length / PER);

    document.getElementById('pgInfo').textContent = filtered.length
      ? `Mostrando ${start+1}–${Math.min(start+PER, filtered.length)} de ${filtered.length}`
      : 'Mostrando 0';
    renderPagination('pgBar', page, pages, p => { page = p; renderTable(); });

    if (!slice.length) {
      document.getElementById('cBody').innerHTML = `
        <tr><td colspan="7">
          <div class="empty-state">
            <div class="empty-state-title">Sin clientes</div>
            <div class="empty-state-desc">No hay clientes que coincidan con la búsqueda</div>
          </div>
        </td></tr>`;
      return;
    }

    document.getElementById('cBody').innerHTML = slice.map(c => {
      const nom = `${c.first_name||''} ${c.last_name||''}`.trim() || '—';
      const ini = Fmt.initials(nom);
      return `
        <tr style="cursor:pointer;" onclick="viewClient(${c.id})">
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="client-avatar">${ini}</div>
              <div>
                <div style="font-weight:600;">${nom}</div>
                <div style="font-size:11px;color:var(--text-muted);">#${c.id}</div>
              </div>
            </div>
          </td>
          <td>
            <div style="font-size:13px;">${c.email||'—'}</div>
            <div style="font-size:11px;color:var(--text-muted);">${c.phone||''}</div>
          </td>
          <td style="font-size:13px;color:var(--text-muted);">${c.city||'—'}</td>
          <td style="font-family:var(--font-mono);font-size:12px;">${c.cedula||'—'}</td>
          <td>
            <div style="font-size:12px;font-weight:600;">${c.created_by_name||'—'}</div>
            <div style="font-size:11px;color:var(--text-muted);">${c.created_by_role||''}</div>
          </td>
          <td style="font-size:12px;color:var(--text-muted);">${Fmt.datetime(c.created_at)}</td>
          <td onclick="event.stopPropagation();" style="white-space:nowrap;">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="viewClient(${c.id})" title="Ver perfil">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="btn btn-secondary btn-sm btn-icon" onclick="editClient(${c.id})" title="Editar">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            ${user.is_admin ? `
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteClient(${c.id},'${nom}')" title="Eliminar">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            </button>` : ''}
          </td>
        </tr>`;
    }).join('');
  }

  /* ═══════════ VER DETALLE ═══════════ */
  window.viewClient = function(id) {
    const c = customers.find(x => x.id == id);
    if (!c) return;
    const nom = `${c.first_name||''} ${c.last_name||''}`.trim() || '—';
    const ini = Fmt.initials(nom);

    document.getElementById('detTitle').textContent = nom;
    document.getElementById('detBody').innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
          display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;">
          ${ini}
        </div>
        <div>
          <div style="font-size:18px;font-weight:700;">${nom}</div>
          <div style="font-size:13px;color:var(--text-muted);">${c.email||'Sin email'}</div>
          ${c.cedula ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:2px;">CI: ${c.cedula}</div>` : ''}
        </div>
      </div>

      <div class="det-grid2">
        <div class="info-block">
          <div class="info-label">Teléfono</div>
          <div class="info-val">${c.phone||'—'}</div>
        </div>
        <div class="info-block">
          <div class="info-label">Ciudad</div>
          <div class="info-val">${c.city||'—'}</div>
        </div>
      </div>

      ${c.address ? `
      <div class="info-block" style="margin-bottom:12px;">
        <div class="info-label">Dirección</div>
        <div class="info-val">${c.address}${c.postal_code ? ' — CP: '+c.postal_code : ''}</div>
      </div>` : ''}

      ${c.notes ? `
      <div class="info-block" style="margin-bottom:12px;">
        <div class="info-label">Notas</div>
        <div style="font-size:13px;color:var(--text-muted);font-style:italic;">${c.notes}</div>
      </div>` : ''}

      <div class="info-block">
        <div class="info-label">Registrado por</div>
        <div class="info-val">${c.created_by_name||'—'}</div>
        <div class="info-sub">${c.created_by_role||''} · ${Fmt.datetime(c.created_at)}</div>
      </div>
    `;

    document.getElementById('detFooter').innerHTML = `
      <button class="btn btn-secondary" onclick="Modal.closeAll()">Cerrar</button>
      <button class="btn btn-primary" onclick="Modal.closeAll(); editClient(${c.id})">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Editar
      </button>`;

    Modal.open('modalDetail');
  };

  /* ═══════════ ABRIR FORMULARIO ═══════════ */
  function openForm(c = null) {
    document.getElementById('formTitle').textContent = c ? 'Editar Cliente' : 'Nuevo Cliente';
    document.getElementById('fId').value    = c ? c.id    : '';
    document.getElementById('fFn').value    = c ? c.first_name||'' : '';
    document.getElementById('fLn').value    = c ? c.last_name||''  : '';
    document.getElementById('fEmail').value = c ? c.email||''      : '';
    document.getElementById('fPhone').value = c ? c.phone||''      : '';
    document.getElementById('fCed').value   = c ? c.cedula||''     : '';
    document.getElementById('fCity').value  = c ? c.city||''       : '';
    document.getElementById('fAddr').value  = c ? c.address||''    : '';
    document.getElementById('fPostal').value= c ? c.postal_code||'': '';
    document.getElementById('fNotes').value = c ? c.notes||''      : '';
    Modal.open('modalForm');
    setTimeout(() => document.getElementById('fFn').focus(), 200);
  }

  document.getElementById('btnNew').addEventListener('click', () => openForm());

  window.editClient = function(id) {
    const c = customers.find(x => x.id == id);
    if (c) openForm(c);
  };

  /* ═══════════ GUARDAR ═══════════ */
  document.getElementById('btnSave').addEventListener('click', async () => {
    const id    = document.getElementById('fId').value;
    const fn    = document.getElementById('fFn').value.trim();
    const ln    = document.getElementById('fLn').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    const ced   = document.getElementById('fCed').value.trim();
    const city  = document.getElementById('fCity').value.trim();
    const addr  = document.getElementById('fAddr').value.trim();
    const post  = document.getElementById('fPostal').value.trim();
    const notes = document.getElementById('fNotes').value.trim();

    if (!fn || !ln || !email) { Toast.warning('Nombre, apellido y email son requeridos'); return; }

    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Guardando...';

    try {
      const body = {
        first_name: fn, last_name: ln, email, phone,
        cedula: ced, city, address: addr, postal_code: post, notes,
        created_by: user.id
      };

      let d;
      if (id) {
        body.id = parseInt(id);
        d = await API.put('customers.php?action=update', body);
      } else {
        d = await API.post('customers.php?action=create', body);
      }

      if (d.success) {
        Toast.success(id ? 'Cliente actualizado' : 'Cliente creado');
        Modal.closeAll();
        load();
      } else {
        Toast.error(d.message || 'Error al guardar');
      }
    } catch(e) {
      Toast.error('Error de conexión: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });

  /* ═══════════ ELIMINAR ═══════════ */
  window.deleteClient = function(id, nom) {
    Modal.confirm(
      `¿Eliminar a ${nom}?`,
      'Esta acción eliminará permanentemente al cliente de la base de datos.',
      async () => {
        try {
          const d = await API.delete(`customers.php?action=delete&id=${id}`);
          if (d.success) { Toast.success('Cliente eliminado'); load(); }
          else Toast.error(d.message || 'Error');
        } catch { Toast.error('Error de conexión'); }
      }, true
    );
  };

  /* ═══════════ EVENTOS ═══════════ */
  document.getElementById('btnRefresh').addEventListener('click', load);
  document.getElementById('fSearch').addEventListener('input', debounce(applyFilter, 350));
  document.getElementById('btnClear').addEventListener('click', () => {
    document.getElementById('fSearch').value = '';
    applyFilter();
  });

  load();
})();
</script>
</body>
</html>
