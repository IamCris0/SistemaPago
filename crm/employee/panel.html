<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Empleado - Mawewe CRM</title>
    <link rel="stylesheet" href="../assets/css/employee.css">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-title">
                <h1>🏪 Panel de Empleado</h1>
                <p id="employeeName">Cargando...</p>
            </div>
            <div class="header-actions">
                <button onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="alert" class="alert"></div>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Días Trabajados</h3>
                <div class="value" id="daysWorked">0</div>
                <div class="label">Este mes</div>
            </div>
            <div class="stat-card">
                <h3>Horas Totales</h3>
                <div class="value" id="totalHours">0</div>
                <div class="label">Este mes</div>
            </div>
            <div class="stat-card">
                <h3>Promedio Diario</h3>
                <div class="value" id="avgHours">0</div>
                <div class="label">Horas por día</div>
            </div>
        </div>

        <!-- Control de Asistencia -->
        <div class="attendance-section">
            <h2>📅 Control de Asistencia</h2>

            <div class="attendance-controls">
                <button class="btn btn-check-in" id="btnCheckIn" onclick="checkIn()">
                    <span>🕐</span> Marcar Entrada
                </button>
                <button class="btn btn-check-out" id="btnCheckOut" onclick="checkOut()" disabled>
                    <span>🕐</span> Marcar Salida
                </button>
            </div>

            <div class="current-status" id="currentStatus" style="display: none;">
                <h3>Estado Actual</h3>
                <div class="status-info">
                    <div class="status-item">
                        <div class="icon">🕐</div>
                        <div class="info">
                            <div class="label">Entrada</div>
                            <div class="value" id="checkInTime">--:--</div>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="icon">⏱️</div>
                        <div class="info">
                            <div class="label">Tiempo Transcurrido</div>
                            <div class="value" id="elapsedTime">0h 0m</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Historial -->
        <div class="history-section">
            <h2>📊 Historial de Asistencia</h2>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Horas</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px;">
                            Cargando historial...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="crm.js"></script>
</body>
</html>
